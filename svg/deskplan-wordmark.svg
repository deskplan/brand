<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="DeskPlan">
  <title>DeskPlan — logotype</title>
  <!-- Badge + logotype horizontal. « Desk » bleu X, « Plan » orange X. Fond clair. -->
  <rect x="8" y="28" width="144" height="144" rx="34" fill="#01426A"/>
  <text x="80" y="104" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-3" fill="#ffffff">DP</text>
  <circle cx="122" cy="150" r="10" fill="#EC6608"/>
  <text x="184" y="102" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#01426A">Desk</tspan><tspan fill="#EC6608">Plan</tspan>
  </text>
</svg>
