<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="DeskPlan">
  <title>DeskPlan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01426A"/>
      <stop offset="1" stop-color="#012E49"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Badge (tuile blanche → contraste sur le bleu). -->
  <rect x="120" y="205" width="230" height="230" rx="54" fill="#ffffff"/>
  <text x="235" y="330" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" letter-spacing="-4" fill="#01426A">DP</text>
  <circle cx="298" cy="393" r="14" fill="#EC6608"/>
  <!-- Logotype + accroche. -->
  <text x="410" y="300" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">Desk</tspan><tspan fill="#FF7E2E">Plan</tspan>
  </text>
  <text x="414" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" fill="#9DC0DA">Gestion du personnel et des bureaux des laboratoires</text>
  <text x="414" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" letter-spacing="3" fill="#6BA4D8">WEB  ·  API  ·  macOS</text>
</svg>
